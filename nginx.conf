server {
    listen 80;
    server_name _;

    # This container's published port is bound to 127.0.0.1 on the host, so
    # the only thing that can ever reach it is Tailscale Funnel's local
    # proxy after terminating the public HTTPS connection. Funnel already
    # sets X-Forwarded-For to the real client IP, so it's safe to forward
    # as-is here -- nothing external can bypass it to inject a fake value.

    # Publicly mounted at https://<host>/shortlink/ via Tailscale Funnel's
    # --set-path. Funnel forwards the full path including this prefix, so
    # everything below strips /shortlink before serving/proxying.

    location = /shortlink {
        return 301 /shortlink/;
    }

    location = /shortlink/ {
        alias /usr/share/nginx/html/;
        try_files index.html =404;
    }

    location = /shortlink/favicon.svg {
        alias /usr/share/nginx/html/favicon.svg;
    }

    location /shortlink/assets/ {
        alias /usr/share/nginx/html/assets/;
    }

    location = /shortlink/short {
        proxy_pass http://url-shortener-backend:8080/short;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }

    location = /shortlink/ping {
        proxy_pass http://url-shortener-backend:8080/ping;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }

    # Catch-all: short codes (GET /shortlink/{code}) redirect via the backend.
    location /shortlink/ {
        rewrite ^/shortlink/(.*)$ /$1 break;
        proxy_pass http://url-shortener-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }
}
